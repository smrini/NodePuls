<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.8" />
      <animate id="gradientAnim" attributeName="x1" values="0%;20%;0%" dur="2s" repeatCount="indefinite"/>
      <animate id="gradientAnim2" attributeName="x2" values="100%;80%;100%" dur="2s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Text, stretched to fill width -->
  <text x="0" y="38" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#1f2937">
    Node
    <tspan x="110" y="38" fill="url(#pulseGradient)" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>puls
    </tspan>
  </text>
  
  <!-- Tagline, aligned at the bottom -->
  <text x="2" y="58" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    HOMELAB MONITORING
  </text>
</svg>
