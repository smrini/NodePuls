<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06d6a0"/>
      <stop offset="50%" style="stop-color:#00c9a7"/>
      <stop offset="100%" style="stop-color:#118ab2"/>
    </linearGradient>
  </defs>
  
  <!-- Main container - rounded square -->
  <rect x="15" y="15" width="70" height="70" rx="16" ry="16" 
        fill="#1e293b" 
        stroke="url(#iconGradient)" 
        stroke-width="2"/>
  
  <!-- Pulse/heartbeat line -->
<path d="M 25 45 L 35 45 L 40 30 L 45 60 L 50 20 L 55 55 L 60 45 L 75 45" 
            fill="none" 
            stroke="url(#pulseGradient)" 
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round">

</path>
  
  <!-- Server rack representation - bottom -->
  <rect x="23" y="63" width="54" height="7" rx="2" fill="url(#iconGradient)" opacity="0.8"/>
  <rect x="23" y="72" width="54" height="7" rx="2" fill="url(#iconGradient)" opacity="0.6"/>
  
  <!-- Status dots on servers -->
  <circle cx="70" cy="66.5" r="2" fill="#06d6a0"/>
  <circle cx="70" cy="75.5" r="2" fill="#06d6a0"/>
</svg>